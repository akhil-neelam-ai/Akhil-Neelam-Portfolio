<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Akhil Neelam</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        if (t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Tokens mirror client/src/index.css */
      :root {
        --background: 0 0% 100%;
        --foreground: 210 26% 29%;
        --muted-foreground: 210 10% 45%;
        --border: 210 10% 90%;
        --sidebar: 210 29% 25%;
        --sidebar-foreground: 0 0% 95%;
        --cta: 352 55% 72%;
        --cta-foreground: 210 29% 20%;
        --glow: 352 55% 72% / 0.3;
        --ring: 210 29% 25%;
        --outline: rgba(0, 0, 0, 0.1);
      }
      .dark {
        --background: 210 20% 10%;
        --foreground: 0 0% 92%;
        --muted-foreground: 210 8% 55%;
        --border: 210 15% 18%;
        --sidebar: 210 20% 12%;
        --sidebar-foreground: 0 0% 92%;
        --cta: 352 43% 72%;
        --cta-foreground: 210 20% 10%;
        --glow: 352 30% 30% / 0.15;
        --ring: 352 43% 72%;
        --outline: rgba(255, 255, 255, 0.1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Open Sans", system-ui, sans-serif;
        color: hsl(var(--foreground));
        background:
          linear-gradient(to bottom right, hsl(var(--glow)), hsl(var(--background)) 50%, hsl(var(--background)));
        background-color: hsl(var(--background));
        -webkit-font-smoothing: antialiased;
      }

      header {
        background: hsl(var(--sidebar));
        color: hsl(var(--sidebar-foreground));
        padding: 1rem 1.5rem;
      }

      .brand {
        color: inherit;
        text-decoration: none;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      .brand small {
        display: block;
        font-family: "Open Sans", system-ui, sans-serif;
        font-weight: 400;
        font-size: 0.75rem;
        opacity: 0.8;
        margin-top: 0.125rem;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        padding: 3rem 1.5rem 5rem;
      }

      .content {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
      }

      .inner {
        max-width: 36rem;
        animation: rise 0.55s ease both;
      }

      .eyebrow {
        margin: 0 0 1rem;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: hsl(var(--muted-foreground));
      }

      h1 {
        margin: 0 0 1.5rem;
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        line-height: 1.1;
      }

      .lede {
        margin: 0 0 2rem;
        font-size: clamp(1.125rem, 2.2vw, 1.25rem);
        line-height: 1.65;
        color: hsl(var(--muted-foreground));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 2.75rem;
        padding: 0 1.75rem;
        border-radius: 0.5rem;
        border: 1px solid transparent;
        font: 600 0.9375rem/1 "Open Sans", system-ui, sans-serif;
        text-decoration: none;
        transition: filter 0.2s ease, background-color 0.2s ease;
      }

      .btn:focus-visible {
        outline: 2px solid hsl(var(--ring));
        outline-offset: 2px;
      }

      .btn-primary {
        background: hsl(var(--cta));
        color: hsl(var(--cta-foreground));
      }

      .btn-primary:hover {
        filter: brightness(0.95);
      }

      .btn-outline {
        color: hsl(var(--foreground));
        border-color: var(--outline);
        background: transparent;
      }

      .btn-outline:hover {
        background: var(--outline);
      }

      .btn svg {
        width: 1rem;
        height: 1rem;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (max-width: 26rem) {
        .btn {
          flex: 1 1 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .inner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">
        Akhil Neelam
        <small>UC Berkeley Haas MBA</small>
      </a>
    </header>
    <main>
      <div class="content">
        <div class="inner">
          <p class="eyebrow">404 · Page not found</p>
          <h1>This page doesn't exist.</h1>
          <p class="lede">The link may be old or mistyped. You can find everything on the homepage.</p>
          <div class="actions">
            <a class="btn btn-primary" href="/">Go to homepage</a>
            <a class="btn btn-outline" href="/Akhil_Neelam_Resume.pdf" download="Akhil_Neelam_Resume.pdf">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download resume
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
