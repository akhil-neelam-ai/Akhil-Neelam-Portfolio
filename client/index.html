    <script type="module">
      (function registerPortfolioTool() {
        const modelContext = navigator.modelContext;
        if (!modelContext) {
          return;
        }

        const tool = {
          name: "get_portfolio_summary",
          description:
            "Return a concise machine-readable summary of Akhil Neelam's portfolio, projects, public links, and contact information.",
          inputSchema: {
            type: "object",
            properties: {
              section: {
                type: "string",
                enum: ["all", "profile", "projects", "contact"],
                description: "Optional section to prioritize in the returned summary."
              }
            },
            additionalProperties: false
          },
          annotations: {
            readOnlyHint: true
          },
          execute: async () => {
            const response = await fetch("/llms.txt", {
              headers: { Accept: "text/markdown" }
            });
            const text = await response.text();

            return {
              contentType: "text/markdown",
              source: `${window.location.origin}/llms.txt`,
              text
            };
          }
        };

        if (typeof modelContext.registerTool === "function") {
          modelContext.registerTool(tool);
          return;
        }

        if (typeof modelContext.provideContext === "function") {
          modelContext.provideContext({
            tools: [tool],
            resources: [
              {
                uri: `${window.location.origin}/llms.txt`,
                name: "Akhil Neelam portfolio summary",
                mimeType: "text/markdown"
              }
            ]
          });
        }
      })();
    </script>
